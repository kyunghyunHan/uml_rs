[package]
name = "uml-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rfd = "0.15"
resvg = "0.45.1"
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3"
